<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Email Sender</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }
        #message {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>
    <h1>Test Schedule Confirmation Email</h1>
    
    <form id="emailForm">
        <div class="form-group">
            <label for="userEmail">Recipient Email:</label>
            <input type="email" id="userEmail" required value="test@example.com">
        </div>
        
        <div class="form-group">
            <label for="scheduleDate">Date:</label>
            <input type="date" id="scheduleDate" required>
        </div>
        
        <div class="form-group">
            <label for="scheduleTime">Time:</label>
            <input type="time" id="scheduleTime" required>
        </div>
        
        <div class="form-group">
            <label for="scheduleLocation">Location:</label>
            <input type="text" id="scheduleLocation" required value="Conference Room A">
        </div>
        
        <div class="form-group">
            <label for="scheduleNotes">Additional Notes (optional):</label>
            <textarea id="scheduleNotes" rows="3"></textarea>
        </div>
        
        <button type="submit" id="sendButton">Send Confirmation Email</button>
    </form>
    
    <div id="message"></div>

    <script>
        document.getElementById('emailForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const sendButton = document.getElementById('sendButton');
            const messageDiv = document.getElementById('message');
            
            // Get form values
            const userEmail = document.getElementById('userEmail').value;
            const scheduleDetails = {
                date: document.getElementById('scheduleDate').value,
                time: document.getElementById('scheduleTime').value,
                location: document.getElementById('scheduleLocation').value,
                notes: document.getElementById('scheduleNotes').value
            };
            
            // Validate
            if (!userEmail) {
                showMessage('Please enter a recipient email', 'error');
                return;
            }
            
            // Disable button and show loading
            sendButton.disabled = true;
            sendButton.textContent = 'Sending...';
            messageDiv.innerHTML = '';
            
            try {
                const response = await fetch('http://localhost:3001/send-confirmation', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        userEmail,
                        scheduleDetails
                    }),
                });
                
                const data = await response.json();
                
                if (data.success) {
                    showMessage('✅ Confirmation email sent successfully!', 'success');
                    document.getElementById('emailForm').reset();
                } else {
                    showMessage('❌ Failed to send email: ' + data.message, 'error');
                }
            } catch (error) {
                showMessage('❌ Error: ' + error.message, 'error');
            } finally {
                sendButton.disabled = false;
                sendButton.textContent = 'Send Confirmation Email';
            }
        });
        
        function showMessage(message, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = message;
            messageDiv.className = type;
        }
        
        // Set default date to today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('scheduleDate').value = today;
        
        // Set default time to current time + 1 hour
        const now = new Date();
        now.setHours(now.getHours() + 1);
        const timeString = now.toTimeString().slice(0, 5);
        document.getElementById('scheduleTime').value = timeString;
    </script>
</body>
</html>
